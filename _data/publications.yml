      copy_text: A Fractional-Order Gradient Guided Dynamic Block-Coordinate Evolution Strategy for Large-Scale Expensive Optimization
  abstract: >-
    Large-scale expensive optimization problems present a formidable challenge characterized by high-dimensional search spaces constrained by strictly limited evaluation budgets. Although surrogate-assisted evolutionary algorithms (SAEAs) have been widely adopted to mitigate evaluation costs, they often grapple with the prohibitive computational overhead of model training and the deterioration of surrogate accuracy as dimensionality increases. To address these limitations, this work proposes a Fractional-Order Block-Coordinate Evolution Strategy (FOBES) for LSEOPs, which departs from the conventional paradigm of fitness prediction. Instead of relying on complex surrogate models, the proposed method uses fractional-order gradient memory to extract and accumulate directional information from historical evaluations. This estimated ideal direction guides a novel directional consistency pre-screening mechanism, enabling efficient identification of promising candidate solutions within a block-coordinate descent framework. Furthermore, a dynamic random grouping strategy and an adaptive data-driven sampling technique are dynamically integrated to facilitate a smooth transition from exploration to exploitation. Experimental results on the CEC’2013 benchmark suite and the extended CEC’2010 suite with up to 5000 dimensions demonstrate that FOBES significantly outperforms state-of-the-art algorithms in terms of both solution quality and computational efficiency.
