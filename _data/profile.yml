bio: My research focuses on artificial intelligence (AI) and high-performance computing (HPC), including deep learning, brain-inspired neural
  networks, black-box optimization algorithms, and their intersections with HPC. Application areas include energy conversion and management, AI-agent-based
  social simulation, emergency medicine, human-machine collaboration, and AI for Science.
